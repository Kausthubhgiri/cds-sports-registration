<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a4b78">
  <title>CDS Sports Meet | Entry Management</title>
  <style>
    :root{--navy:#073a61;--blue:#087eae;--ink:#102a43;--muted:#627d98;--line:#d9e2ec}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 88% 8%,#3db4dd 0,transparent 28%),radial-gradient(circle at 9% 91%,#155e87 0,transparent 35%),linear-gradient(135deg,#052e4b,#0a527b);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
    .shell{width:min(100%,440px)}.brand{display:flex;align-items:center;justify-content:center;gap:11px;color:#fff;margin-bottom:21px;font-weight:800;letter-spacing:.08em;font-size:12px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.17);font-size:18px}.card{background:rgba(255,255,255,.98);border:1px solid rgba(255,255,255,.45);border-radius:22px;padding:31px;box-shadow:0 26px 70px rgba(0,25,43,.35)}.eyebrow{font-size:10px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}h1{font-size:28px;letter-spacing:-.045em;line-height:1.1;margin:8px 0}p{color:var(--muted);margin:0 0 25px}.field{margin-top:16px}.field label{display:block;margin-bottom:7px;font-size:12px;font-weight:800;color:#38556c}.field input{width:100%;border:1px solid var(--line);border-radius:10px;background:#fbfdff;padding:12px 13px;color:var(--ink);font:inherit;transition:.2s}.field input:focus{outline:3px solid rgba(8,126,174,.19);border-color:var(--blue);background:#fff}.field input::placeholder{color:#9fb2c1}.submit{width:100%;margin-top:24px;border:0;border-radius:10px;padding:13px;background:linear-gradient(105deg,#086c9a,#0c88bc);box-shadow:0 8px 18px rgba(8,126,174,.26);color:#fff;font-weight:800;font:inherit;cursor:pointer;transition:.18s}.submit:hover{transform:translateY(-1px);box-shadow:0 11px 23px rgba(8,126,174,.34)}.submit:focus-visible{outline:3px solid #6ed0f3;outline-offset:3px}.helper{display:flex;gap:9px;margin-top:22px;padding-top:18px;border-top:1px solid #e6edf2;color:#71899b;font-size:11px}.helper span{display:grid;place-items:center;flex:0 0 20px;height:20px;border-radius:50%;background:#e7f4f9;color:#087eae;font-weight:900}.footer{text-align:center;color:rgba(255,255,255,.67);font-size:11px;margin-top:19px}@media(max-width:480px){body{padding:16px}.card{padding:25px 21px;border-radius:18px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="brand-mark">🏅</span><span>CDS SPORTS MEET 2026</span></div>
    <section class="card" aria-labelledby="login-title">
      <div class="eyebrow">EDIT ENTRIES PORTAL</div>
      <h1 id="login-title">Manage entries</h1>
      <p>Sign in to review and update registrations for your school.</p>
      <form method="POST" action="/verify-login">
        <div class="field"><label for="username">Username or school name</label><input id="username" type="text" name="username" placeholder="Enter your username or school name" autocomplete="username" required autofocus></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required></div>
        <button class="submit" type="submit">Continue to entries <span aria-hidden="true">→</span></button>
      </form>
      <div class="helper"><span aria-hidden="true">i</span><div>Use the Credentials given to you by the Administrators to login.</div></div>
    </section>
    <div class="footer">CDS Sports Meet 2026 · Entries Editing And Review Portal</div>
  </main>
</body>
</html>
